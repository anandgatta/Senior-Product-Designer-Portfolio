<g font-size="16" fill="#151515"><text x="48" y="149">Primary</text><text x="48" y="245">Secondary</text><text x="48" y="341">Text</text></g>
<rect x="326" y="124" width="218" height="36" rx="4" fill="#1D8755"/>
<rect x="326.5" y="220.5" width="217" height="35" rx="4" fill="#FFFFFF" stroke="#1D8755"/>
<g text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600"><text x="435" y="142" fill="#FFFFFF">SAVE REVIEW</text><text x="435" y="238" fill="#1D8755">SAVE REVIEW</text><text x="435" y="334" fill="#1D8755">SAVE REVIEW</text></g>
