NTEXTUAL HELP</text><rect x="48" y="90" width="544" height="76" rx="8" fill="#FFFFFF" stroke="#D8E2EA"/><text x="72" y="135" fill="#151515" font-size="18" font-weight="600">Review status</text><rect x="365" y="109" width="133" height="32" rx="5" fill="#E5FAF0" stroke="#E5FAF0"/><text x="381" y="131" fill="#176840" font-size="14" font-weight="600">Reviewed</text><circle cx="548" cy="125" r="11" fill="white" stroke="#52616D"/><text x="545" y="130" fill="#52616D" font-size="15" font-weight="600">i</text><rect x="232" y="194" width="360" height="174" rx="8" fill="#FFFFFF" stroke="#D8E2EA"/><text x="252" y="230" fill="#151515" font-size="17" font-weight="600">What does reviewed mean?</text><text x="252" y="263" fill="#52616D" font-size="14" font-weight="400">A reviewer has checked this record.</text><text x="252" y="289" fill="#52616D" font-size="14" font-weight="400">The status tracks review progress,</text><text x="252" y="315" fill="#52616D" font-size="14" font-weight="400">not scientific validity.</text><path d="M536 194l12-12 12 12" fill="white" stroke="#D8E2EA"/></g></svg><rect x="40" y="940" width="480" height="280" rx="18" fill="#FFFFFF"/><text x="64" y="974" font-family="Manrope,Arial,sans-serif" font-size="14" fill="#52616D">07 / DROPDOWN</text><rect x="76" y="998" width="408" height="44" rx="4" fill="white" stroke="#1D8755"/><text x="94" y="1026" font-family="Manrope,Arial,sans-serif" font-size="16" fill="#151515">Select category</text><text x="452" y="1026" font-family="Manrope,Arial,sans-serif" font-size="18" fill="#52616D">⌄</text><rect x="76" y="1048" width="408" height="146" rx="4" fill="white" stroke="#D8E2EA"/><rect x="94" y="1066" width="16" height="16" rx="2" fill="white" stroke="#798A98"/><text x="126" y="1080" font-family="Manrope,Arial,sans-serif" font-size="16" fill="#151515">Clinical study</text><rect x="94" y="1110" width="16" height="16" rx="2" fill="white" stroke="#798A98"/><text x="126" y="1124" font-family="Manrope,Arial,sans-serif" font-size="16" fill="#151515">Medical guideline</text><rect x="94" y="1154" width="16" height="16" rx="2" fill="white" stroke="#798A98"/><text x="126" y="1168" font-family="Manrope,Arial,sans-serif" font-size="16" fill="#151515">Literature review</text><rect x="1060" y="940" width="500" height="280" rx="18" fill="#FFFFFF"/><text x="1084" y="974" font-family="Manrope,Arial,sans-serif" font-size="14" fill="#52616D">08 / STATUS &amp; FEEDBACK</text><rect x="1084" y="998" width="452" height="48" rx="6" fill="#EDF5FB" stroke="#09609F"/><text x="1102" y="1028" font-family="Manrope,Arial,sans-serif" font-size="16" fill="#09609F">Information · Review ready</text><rect x="1084" y="1062" width="452" height="48" rx="6" fill="#E5FAF0" stroke="#176840"/><text x="1102" y="1092" font-family="Manrope,Arial,sans-serif" font-size="16" fill="#176840">Success · Notes saved</text><rect x="1084" y="1126" width="452" height="48" rx="6" fill="#FFF7E6" stroke="#895700"/><text x="1102" y="1156" font-family="Manrope,Arial,sans-serif" font-size="16" fill="#895700">Warning · Source missing</text><rect x="540" y="1080" width="500" height="140" rx="18" fill="#09609F"/><text x="568" y="1123" font-family="Manrope,Arial,sans-serif" font-size="14" fill="#FFFFFF">CONSISTENT BY DESIGN</text><text x="568" y="1158" font-family="Manrope,Arial,sans-serif" font-size="23" fill="#FFFFFF">Shared states. Clear feedback.</text><text x="568" y="1190" font-family="Manrope,Arial,sans-serif" font-size="16" fill="#FFFFFF">One light-theme component language.</text><rect x="40" y="1240" width="1520" height="360" rx="18" fill="#FFFFFF"/><text x="64" y="1274" font-family="Manrope,Arial,sans-serif" font-size="14" fill="#52616D">09 / RECORDS TABLE</text><svg x="52" y="1288" width="1496" height="300" viewBox="0 0 960 470"><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Manrope, Arial, sans-serif"><text x="40" y="53" fill="#151515" font-size="24" font-weight="600">Research records</text><text x="40" y="82" fill="#52