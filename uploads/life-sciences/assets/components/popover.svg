<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img"><title>Popover | Reconstructed example</title><rect width="100%" height="100%" fill="#F2F7FA"/><g font-family="Manrope, Arial, sans-serif"><text x="36" y="55" fill="#52616D" font-size="12" font-weight="600">CONTEXTUAL HELP</text><rect x="48" y="90" width="544" height="76" rx="8" fill="#FFFFFF" stroke="#D8E2EA"/><text x="72" y="135" fill="#151515" font-size="18" font-weight="600">Review status</text><rect x="365" y="109" width="133" height="32" rx="5" fill="#E5FAF0" stroke="#E5FAF0"/><text x="381" y="131" fill="#176840" font-size="14" font-weight="600">Reviewed</text><circle cx="548" cy="125" r="11" fill="white" stroke="#52616D"/><text x="545" y="130" fill="#52616D" font-size="15" font-weight="600">i</text><rect x="232" y="194" width="360" height="174" rx="8" fill="#FFFFFF" stroke="#D8E2EA"/><text x="252" y="230" fill="#151515" font-size="17" font-weight="600">What does reviewed mean?</text><text x="252" y="263" fill="#52616D" font-size="14" font-weight="400">A reviewer has checked this record.</text><text x="252" y="289" fill="#52616D" font-size="14" font-weight="400">The status tracks review progress,</text><text x="252" y="315" fill="#52616D" font-size="14" font-weight="400">not scientific validity.</text><path d="M536 194l12-12 12 12" fill="white" stroke="#D8E2EA"/></g></svg>